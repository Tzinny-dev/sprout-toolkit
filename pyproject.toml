[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprout-toolkit"
version = "0.2.1"
description = "Deterministic procedural 2D asset generation for Expo + react-native-skia"
readme = "README.md"
authors = [{ name = "Tzinny" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["procgen", "sprites", "spritesheet", "skia", "expo", "react-native", "game-dev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # Pinned to <13 because CI validates against 12.x; 14 (2027) deprecates
    # Image.getdata, which tests still use. Loosening requires re-running the
    # full suite under the newer version.
    "pillow>=10,<13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Tzinny-dev/sprout-toolkit"
Repository = "https://github.com/Tzinny-dev/sprout-toolkit"
Issues = "https://github.com/Tzinny-dev/sprout-toolkit/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sprout = "sprout.cli:app"

[tool.setuptools.packages.find]
include = ["sprout*"]

[tool.setuptools.package-data]
sprout = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]